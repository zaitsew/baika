# teyla.toml — what must run without you, and what only you can confirm.
#
# `teyla routines` reads this file. `teyla run` reads the routines in it that
# declare a `step`. Both halves rot silently, which is why they live in one file.

[product]
name = "baika"
# A command printing key=value counters, read by `teyla products`. The
# built-but-nobody-used-it detector — fill it in before you ship, not after.
usage = "./check.sh usage"

# Apple distribution: the bundle id `teyla testflight` asks App Store Connect about.
[release]
apple_bundle_id = "com.zaitsew.baika"

# Android distribution: the application id `teyla play` asks Google Play about.
# android_package = "com.example.app"


# ---------------------------------------------------------------------------
# A legacy routine: scheduled somewhere else, reported on here.
# kind = launchd | cron | pg_cron | github-actions | script
# ---------------------------------------------------------------------------
# [[routine]]
# name = "nightly-sync"
# kind = "launchd"
# label = "com.example.sync"
# every = "1d"                          # 15m | 1h | 1d | 7d | any <n>m|h|d (script routines may omit label and every)
# log = "~/Library/Logs/example-sync.log"
# paused = "2026-01-01: owner keeps it off until the product is reviewed"   # deliberately off: shown as
#                                       # `paused`, never a problem; delete the key to watch it again


[[check]]
name = "sign in on the phone"
how = "app -> Perform -> Sign in with Apple -> the Perform form opens"
status = "untested"                     # needs the Apple capability on the App ID and the hub's Apple provider to accept com.zaitsew.baika

[[check]]
name = "tell a story"
how = "Perform -> topic 'the history of the Canary Islands' -> Zhvanetsky -> Tell -> accept the AI consent -> the title and text stream, the voice starts before the text ends"
status = "untested"                     # needs the hub ElevenLabs key; without it the backup voice speaks and the note shows

[[check]]
name = "replay offline"
how = "Library -> open the story -> airplane mode on -> Play -> it plays; lock the screen -> lock-screen controls work"
status = "untested"

[productize]
primary = "ios"
users = "owner"            # owner | family | testers | public
target = "owner"
platforms = ["ios"]
identity = "accounts-hub"
tenancy = "per-device"     # stories and audio live in the app's own storage
backend = "accounts-hub"   # product slug baika; metered `ai` calls and `ai/narrate`
